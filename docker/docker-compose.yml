name: oc2api

services:
  oc2api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: oc2api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      API_KEY: "${API_KEY:-}"
      DEBUG: "${DEBUG:-false}"
      BASE_URL: "${BASE_URL:-}"
      ZEN_API_BASE_URL: "${ZEN_API_BASE_URL:-}"
      ZEN_CONNECT_TIMEOUT_MS: "${ZEN_CONNECT_TIMEOUT_MS:-60000}"
      OC2API_EGRESS_URL: "${OC2API_EGRESS_URL:-}"
      OC2API_EGRESS_USER: "${OC2API_EGRESS_USER:-}"
      OC2API_EGRESS_PASS: "${OC2API_EGRESS_PASS:-}"
    restart: always
