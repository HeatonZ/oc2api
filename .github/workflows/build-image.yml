name: Build and Push to GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 允许手动触发

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Resolve image tags
        id: tags
        # IMAGE_NAME 由上面的步骤写进 $GITHUB_ENV，这里直接当环境变量用；
        # GITHUB_REF_TYPE / GITHUB_REF_NAME / GITHUB_SHA 是 Actions 默认环境变量。
        run: |
          set -euo pipefail
          tags=()
          # 标签推送（例如 v2.4.1）→ 发布不可变版本号镜像，部署端可钉版本。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=("${IMAGE_NAME}:${GITHUB_REF_NAME#v}")
          # 分支推送 / 手动触发 → floating 的 latest + 可回溯到提交的标签。
          else
            tags+=("${IMAGE_NAME}:latest" "${IMAGE_NAME}:${GITHUB_SHA}")
          fi
          {
            echo "tags<<TAGS_EOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tags for ${GITHUB_REF} (${GITHUB_REF_TYPE}):"
          printf '%s\n' "${tags[@]}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          # 上游 v3.0.0 起 Dockerfile 移入 docker/ 子目录（修复 Vercel 误判为容器项目），
          # context 仍是仓库根，因为 Dockerfile 内 COPY 的是根下的 package.json 与 server/。
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
